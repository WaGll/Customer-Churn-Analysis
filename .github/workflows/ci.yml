name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Ensure output directories
      run: mkdir -p output/results output/visualizations output/models

    - name: Verify module imports
      env:
        PYTHONPATH: .
      run: |
        python -c "
        from src.data_loader import DataLoader; print('data_loader OK')
        from src.feature_engineering import FeatureEngineer; print('feature_engineering OK')
        from src.association_rules import AssociationRuleMiner; print('association_rules OK')
        from src.clustering import ClusterAnalyzer; print('clustering OK')
        from src.prediction import ChurnPredictor; print('prediction OK')
        from src.api import app; print('api OK')
        print('All imports successful')
        "

    - name: Run tests with pytest
      env:
        PYTHONPATH: .
      run: |
        set -o pipefail
        pytest tests/ -v --tb=long 2>&1 | tee test-output.txt
        echo "---DEPENDENCIES---" >> test-output.txt
        pip freeze | grep -E "pandas|numpy|scikit|kmodes|mlxtend|matplotlib|seaborn|pytest" >> test-output.txt

    - name: Show test failures
      if: failure()
      run: |
        echo '## Pytest Output (first 80 lines)' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        head -80 test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo '## Pytest Output (last 80 lines)' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -80 test-output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload test output
      if: 'always()'
      uses: actions/upload-artifact@v4
      with:
        name: test-output-py${{ matrix.python-version }}
        path: test-output.txt

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run performance test
      env:
        PYTHONPATH: .
      run: |
        python tests/performance_test.py --data-path data/customer_churn_data.xlsx

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t customer-churn-analysis:latest -f docker/Dockerfile .

    - name: Test Docker image run
      run: |
        docker run --rm customer-churn-analysis:latest \
          python run_analysis.py --no-visualization --skip-prediction
