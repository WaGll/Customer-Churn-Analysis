name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Ensure output directories
      run: mkdir -p output/results output/visualizations output/models

    - name: Verify module imports
      env:
        PYTHONPATH: .
      run: |
        python -c "
        from src.data_loader import DataLoader; print('data_loader OK')
        from src.feature_engineering import FeatureEngineer; print('feature_engineering OK')
        from src.association_rules import AssociationRuleMiner; print('association_rules OK')
        from src.clustering import ClusterAnalyzer; print('clustering OK')
        from src.prediction import ChurnPredictor; print('prediction OK')
        from src.api import app; print('api OK')
        print('All imports successful')
        "

    - name: Run tests with pytest
      env:
        PYTHONPATH: .
      run: pytest tests/ -v --tb=long --cov=src --cov-report=html

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run performance test
      env:
        PYTHONPATH: .
      run: |
        python tests/performance_test.py --data-path data/customer_churn_data.xlsx

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t customer-churn-analysis:latest -f docker/Dockerfile .

    - name: Test Docker image run
      run: |
        mkdir -p /tmp/churn-data
        docker run --rm -v /tmp/churn-data:/app/data customer-churn-analysis:latest \
          python -c "
import pandas as pd, numpy as np, os
rng = np.random.RandomState(42); n = 100
df = pd.DataFrame({
    '顾客ID': range(1,n+1), '用户流失标签': rng.choice([0,1],n,p=[0.7,0.3]),
    '使用平台时间_月': rng.randint(1,60,n), '常用登陆设备': rng.choice(['Mobile Phone','Phone','Pad','PC'],n),
    '城市等级': rng.randint(1,5,n), '仓库到顾客地址': rng.randint(1,20,n),
    '婚姻情况': rng.choice(['Single','Married','Divorced'],n), '年龄分组': rng.randint(1,7,n),
    '性别': rng.choice(['Male','Female'],n), '使用App时间_时': rng.randint(0,24,n),
    '上月订单数量单': rng.randint(0,10,n), '订单数量较去年增加_单': rng.randint(-5,10,n),
    '距上次下单天数_天': rng.randint(0,90,n),
    '上月客户的首选订单类别': rng.choice(['Laptop & Accessory','Mobile Phone','Fashion','Household','Other'],n),
    '用户关注的主播数量': rng.randint(0,20,n), '顾客对服务的满意度': rng.randint(1,6,n),
    '上月投诉次数': rng.choice([0,0,0,0,1,2],n), '上月使用的优惠劵数量_张': rng.randint(0,5,n),
    '上月平均折扣金额': np.round(rng.uniform(0,300,n),2),
})
df.to_excel('/app/data/customer_churn_data.xlsx', index=False)
print(f'Generated {len(df)} rows of synthetic data')
"
        docker run --rm -v /tmp/churn-data:/app/data customer-churn-analysis:latest \
          python run_analysis.py --no-visualization --skip-prediction
